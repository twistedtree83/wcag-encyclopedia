<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual Encyclopedia of WCAG 2.2</title>
    <meta
      name="description"
      content="Every Level A and AA success criterion in WCAG 2.2, shown rather than described: a plain-English restatement, a failing example, and the same interface after it passes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--@tokens-->
    <script>
      /*
       * Runs before first paint so the page never flashes the wrong theme. Mirrors
       * resolveTheme() in src/theme/useTheme.ts: an explicit choice wins over the OS
       * setting in both directions.
       */
      (function () {
        try {
          var stored = localStorage.getItem('wcag-encyclopedia:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* storage blocked — the CSS media query still gives the right default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
