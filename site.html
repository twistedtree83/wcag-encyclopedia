<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The template for every pre-rendered page (ADR 0001). scripts/prerender.mjs fills the
      title, description, route and app markup per route, then removes this file from dist/.
    -->
    <!-- Extra head markup per route: Home's old #1.4.3 redirect (src/site/legacyRedirect.ts). -->
    <!--@legacy-redirect-->
    <title><!--@title--></title>
    <meta name="description" content="<!--@description-->" />
    <!-- The page's absolute production URL (ADR 0006), filled by scripts/prerender.mjs. -->
    <!--@canonical-->
    <!-- The page's JSON-LD (src/site/jsonLd.ts), filled and checked by scripts/prerender.mjs. -->
    <!--@structured-data-->
    <!-- Preloads for the self-hosted body and heading fonts, filled by scripts/prerender.mjs. -->
    <!--@fonts-->
    <!--@tokens-->
    <script>
      /*
       * Runs before first paint so the page never flashes the wrong theme. Mirrors
       * resolveTheme() in src/theme/useTheme.ts: an explicit choice wins over the OS
       * setting in both directions.
       */
      (function () {
        try {
          var stored = localStorage.getItem('wcag-encyclopedia:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* storage blocked: the CSS media query still gives the right default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--@app--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
    <!-- The Cloudflare Web Analytics beacon, only when CF_ANALYTICS_TOKEN is set (src/site/analytics.ts). -->
    <!--@analytics-->
  </body>
</html>
